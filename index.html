<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNET — Облачный гейминг нового поколения</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; }
        .glow-effect { box-shadow: 0 0 40px -10px rgba(14, 165, 233, 0.4); }
        .blur-bg { backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-sky-500 selection:text-white">

    <div class="absolute top-0 left-1/4 w-96 h-96 bg-sky-600/20 rounded-full filter blur-[120px] -z-10 animate-pulse"></div>
    <div class="absolute top-1/3 right-1/4 w-[500px] h-[500px] bg-blue-500/10 rounded-full filter blur-[150px] -z-10"></div>

    <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/70 blur-bg px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="#" class="flex items-center gap-3 group">
                <div class="p-2 bg-sky-500 rounded-xl text-slate-950 shadow-[0_0_20px_rgba(14,165,233,0.5)] group-hover:scale-105 transition-all">
                    <i data-lucide="cloud-lightning" class="w-6 h-6"></i>
                </div>
                <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-white via-sky-200 to-sky-400 bg-clip-text text-transparent">CloudNET</span>
            </a>
            <div id="nav-auth-section">
                <button onclick="openModal('auth-modal')" class="px-5 py-2.5 bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 font-bold rounded-xl text-sm cursor-pointer">Личный кабинет</button>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        <section class="max-w-7xl mx-auto px-6 pt-20 pb-16 text-center md:text-left grid md:grid-cols-2 gap-12 items-center">
            <div class="space-y-6">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-sky-500/10 border border-sky-500/30 rounded-full text-xs font-semibold text-sky-400 uppercase tracking-wider">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Локальный Стриминг по Wi-Fi
                </div>
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                    Играй где угодно. <br><span class="bg-gradient-to-r from-sky-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">На максималках.</span>
                </h1>
                <div class="flex flex-col sm:flex-row gap-4 pt-4 justify-center md:justify-start">
                    <button onclick="openModal('pc-modal')" class="px-8 py-4 bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 font-extrabold rounded-xl text-center glow-effect hover:brightness-110 hover:-translate-y-0.5 transition-all cursor-pointer flex items-center justify-center gap-2">
                        <i data-lucide="monitor-play" class="w-5 h-5"></i> Подключиться к ПК
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="pc-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 blur-bg">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-4xl rounded-2xl p-6 relative shadow-2xl space-y-6">
            <button onclick="closeModal('pc-modal')" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
            
            <div id="pc-list-view" class="space-y-4">
                <h3 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="server" class="text-sky-400"></i> Игровые хосты</h3>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h4 class="font-bold text-sm">Python-Node (Домашний сервер)</h4>
                    </div>
                    <button onclick="connectToRealPC()" class="px-5 py-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs font-bold rounded-lg cursor-pointer">Запустить стрим</button>
                </div>
            </div>

            <div id="pc-stream-view" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-sky-400 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Сессия активна</h3>
                    <button onclick="disconnectStream()" class="px-3 py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 text-xs rounded-lg cursor-pointer">Прервать поток</button>
                </div>
                <div id="game-video-container" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 group md:cursor-none">
                    <video id="game-video-element" autoplay playsinline muted class="w-full h-full object-contain"></video>
                    <div id="custom-cursor" class="absolute w-4 h-4 bg-sky-400 border border-white rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 hidden z-50"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 blur-bg">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative shadow-2xl space-y-6">
            <button onclick="closeModal('auth-modal')" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <input type="email" id="auth-email" required placeholder="gamer@cloudnet.ru" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none text-white">
                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none text-white">
                <button type="submit" class="w-full py-3.5 bg-sky-500 text-slate-950 font-bold rounded-xl cursor-pointer">Войти</button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentUser = null;
        let wsSignaling = null;
        let peerConnection = null;
        let dataChannel = null;

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            currentUser = { email: email };
            document.getElementById('nav-auth-section').innerHTML = `<button class="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm font-medium text-emerald-400">${email.split('@')[0]}</button>`;
            closeModal('auth-modal');
        }

        async function connectToRealPC() {
            if (!currentUser) { alert("Сначала войдите в личный кабинет (любая почта)."); return; }
            document.getElementById('pc-list-view').classList.add('hidden');
            document.getElementById('pc-stream-view').classList.remove('hidden');

            // ⚠️ ЗАМЕНИ 192.168.1.50 НА СВОЙ IP ИЗ IPCONFIG
            wsSignaling = new WebSocket('ws://192.168.1.153:8080');
            
            wsSignaling.onopen = async () => {
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                    sdpSemantics: 'plan-b' 
                });

                dataChannel = peerConnection.createDataChannel("controls");
                setupDataChannel();

                peerConnection.addTransceiver('video', { direction: 'recvonly' });

                peerConnection.ontrack = (event) => {
                    const video = document.getElementById('game-video-element');
                    video.srcObject = event.streams[0] || new MediaStream([event.track]);
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                wsSignaling.send(JSON.stringify({
                    type: 'offer',
                    sdp: peerConnection.localDescription.sdp,
                    sender: 'client'
                }));
            };

            wsSignaling.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(msg));
                }
            };
        }

        function setupDataChannel() {
            const container = document.getElementById('game-video-container');
            const cursor = document.getElementById('custom-cursor');

            container.addEventListener('mouseenter', () => cursor.classList.remove('hidden'));
            container.addEventListener('mouseleave', () => cursor.classList.add('hidden'));

            function sendCoordinates(clientX, clientY) {
                const rect = container.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;

                const relativeX = Math.round((x / rect.width) * 1920);
                const relativeY = Math.round((y / rect.height) * 1080);

                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'mousemove', x: relativeX, y: relativeY }));
                }
            }

            container.addEventListener('mousemove', (e) => sendCoordinates(e.clientX, e.clientY));
            
            container.addEventListener('mousedown', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'click', button: e.button === 2 ? 'right' : 'left' }));
                }
            });

            // Поддержка тачскрина для телефонов
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    sendCoordinates(touch.clientX, touch.clientY);
                    if (dataChannel && dataChannel.readyState === 'open') {
                        dataChannel.send(JSON.stringify({ type: 'click', button: 'left' }));
                    }
                }
            });
        }

        function disconnectStream() {
            if (peerConnection) peerConnection.close();
            if (wsSignaling) wsSignaling.close();
            document.getElementById('pc-stream-view').classList.add('hidden');
            document.getElementById('pc-list-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
